{{ if (.Context.Scratch.Get "TOCEnabled") }}
    <section class="widget archives toc-widget">
        <div class="toc-widget-header">
            <div class="toc-widget-title">
                <button class="widget-icon toc-toggle" type="button" data-toc-action="toggle" aria-label="Hide table of contents" aria-expanded="true">
                    {{ partial "helper/icon" "hash" }}
                </button>
                <h2 class="widget-title section-title">{{ T "article.tableOfContents" }}</h2>
            </div>
        </div>

        <div class="widget--toc">
            <nav class="toc-nav" id="TableOfContents">
                {{ partial "article/components/toc" .Context | safeHTML }}
            </nav>
        </div>
    </section>
{{ end }}
